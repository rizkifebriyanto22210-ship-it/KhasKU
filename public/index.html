<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>KhasKU - Kas Kelas</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            overflow: hidden;
            background:
                linear-gradient(rgba(20, 25, 35, 0.55), rgba(20, 25, 35, 0.65)),
                linear-gradient(135deg, #dfe9f3, #ffffff);
        }

        /* =========================
           BACKGROUND KELAS
        ========================== */

        .classroom {
            position: fixed;
            inset: 0;
            z-index: -3;
            background:
                linear-gradient(to bottom,
                    #b9d7ec 0%,
                    #e8f2f8 58%,
                    #9b704e 58%,
                    #805638 100%);
        }

        /* Papan tulis */

        .board {
            position: absolute;
            width: 45%;
            height: 28%;
            top: 8%;
            left: 8%;

            background: #254f43;
            border: 12px solid #6e4b32;
            border-radius: 8px;

            box-shadow:
                0 12px 25px rgba(0, 0, 0, 0.25),
                inset 0 0 25px rgba(0, 0, 0, 0.2);

            animation: boardFloat 5s ease-in-out infinite;
        }

        .board::before {
            content: "KAS KELAS";
            position: absolute;
            top: 35%;
            left: 50%;
            transform: translateX(-50%);

            color: rgba(255, 255, 255, 0.8);
            font-size: clamp(18px, 3vw, 38px);
            font-weight: bold;
            letter-spacing: 4px;
        }

        .board::after {
            content: "KhasKU";
            position: absolute;
            bottom: 15%;
            left: 50%;
            transform: translateX(-50%);

            color: rgba(255, 255, 255, 0.5);
            font-size: clamp(12px, 1.5vw, 20px);
        }

        /* Meja */

        .desk {
            position: absolute;
            bottom: 15%;
            width: 180px;
            height: 80px;

            background: #9a633c;
            border-radius: 10px;

            box-shadow:
                0 15px 20px rgba(0, 0, 0, 0.25);

            animation: deskMove 6s ease-in-out infinite;
        }

        .desk::before,
        .desk::after {
            content: "";
            position: absolute;
            bottom: -70px;
            width: 14px;
            height: 75px;
            background: #543522;
        }

        .desk::before {
            left: 20px;
        }

        .desk::after {
            right: 20px;
        }

        .desk1 {
            left: 7%;
        }

        .desk2 {
            left: 28%;
            animation-delay: 1s;
        }

        .desk3 {
            right: 8%;
            animation-delay: 2s;
        }

        /* =========================
           CAHAYA
        ========================== */

        .light {
            position: fixed;
            width: 500px;
            height: 500px;

            border-radius: 50%;

            background: radial-gradient(circle,
                    rgba(255, 193, 7, 0.18),
                    transparent 70%);

            filter: blur(20px);

            animation: lightMove 8s ease-in-out infinite;
        }

        .light1 {
            top: -180px;
            left: -100px;
        }

        .light2 {
            right: -180px;
            bottom: -150px;

            animation-delay: 3s;
        }

        /* =========================
           UANG & KOIN
        ========================== */

        .money {
            position: fixed;
            z-index: -1;

            font-size: 42px;

            filter: drop-shadow(0 8px 8px rgba(0, 0, 0, 0.25));

            user-select: none;

            animation: moneyFloat 6s ease-in-out infinite;
        }

        .money1 {
            left: 7%;
            top: 15%;
        }

        .money2 {
            right: 8%;
            top: 13%;
            animation-delay: 1.5s;
        }

        .money3 {
            left: 12%;
            bottom: 15%;
            animation-delay: 3s;
        }

        .money4 {
            right: 15%;
            bottom: 18%;
            animation-delay: 4s;
        }

        .coin {
            position: fixed;
            z-index: -1;

            width: 48px;
            height: 48px;

            display: flex;
            justify-content: center;
            align-items: center;

            border-radius: 50%;

            background: linear-gradient(145deg,
                    #ffe27a,
                    #c99416);

            border: 4px solid #fff0a8;

            color: #7a5500;

            font-size: 20px;
            font-weight: bold;

            box-shadow:
                0 10px 20px rgba(0, 0, 0, 0.3);

            animation: coinSpin 5s linear infinite;
        }

        .coin1 {
            left: 25%;
            top: 12%;
        }

        .coin2 {
            right: 30%;
            bottom: 13%;
            animation-delay: 2s;
        }

        .coin3 {
            right: 5%;
            top: 48%;
            animation-delay: 1s;
        }

        /* =========================
           LOGIN CARD
        ========================== */

        .wrapper {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
        }

        .login-card {
            width: 100%;
            max-width: 430px;

            padding: 42px 38px;

            background: rgba(255, 255, 255, 0.92);

            backdrop-filter: blur(18px);

            border: 1px solid rgba(255, 255, 255, 0.7);

            border-radius: 28px;

            box-shadow:
                0 25px 70px rgba(0, 0, 0, 0.35);

            animation:
                cardAppear 0.9s cubic-bezier(.17, .67, .3, 1.3);

            position: relative;
            overflow: hidden;
        }

        .login-card::before {
            content: "";

            position: absolute;
            width: 180px;
            height: 180px;

            background: rgba(255, 166, 0, 0.12);

            border-radius: 50%;

            top: -80px;
            right: -70px;
        }

        /* Logo */

        .logo {
            width: 82px;
            height: 82px;

            margin: 0 auto 20px;

            display: flex;
            justify-content: center;
            align-items: center;

            border-radius: 24px;

            background:
                linear-gradient(135deg,
                    #ff7a00,
                    #ffb347);

            color: white;

            font-size: 38px;
            font-weight: 900;

            box-shadow:
                0 12px 25px rgba(255, 122, 0, 0.35);

            animation: logoBounce 1.2s ease;
        }

        h1 {
            text-align: center;

            color: #202020;

            font-size: 30px;

            margin-bottom: 7px;

            animation: fadeUp 0.8s 0.2s both;
        }

        .subtitle {
            text-align: center;

            color: #777;

            font-size: 14px;

            margin-bottom: 30px;

            animation: fadeUp 0.8s 0.3s both;
        }

        /* Input */

        .input-group {
            margin-bottom: 20px;

            animation: fadeUp 0.8s both;
        }

        .input-group:nth-child(1) {
            animation-delay: 0.4s;
        }

        .input-group:nth-child(2) {
            animation-delay: 0.5s;
        }

        label {
            display: block;

            margin-bottom: 8px;

            color: #333;

            font-size: 14px;
            font-weight: bold;
        }

        .input-box {
            display: flex;
            align-items: center;

            border: 2px solid #e4e4e4;

            border-radius: 14px;

            padding: 0 15px;

            background: #fafafa;

            transition:
                border 0.3s,
                box-shadow 0.3s,
                transform 0.3s;
        }

        .input-box:focus-within {
            border-color: #ff8a00;

            box-shadow:
                0 0 0 4px rgba(255, 138, 0, 0.12);

            transform: translateY(-2px);
        }

        .icon {
            font-size: 20px;

            margin-right: 11px;
        }

        input {
            width: 100%;

            border: none;
            outline: none;

            background: transparent;

            padding: 15px 0;

            font-size: 15px;

            color: #222;
        }

        input::placeholder {
            color: #aaa;
        }

        /* Button */

        .login-button {
            width: 100%;

            margin-top: 5px;

            padding: 15px;

            border: none;

            border-radius: 14px;

            background:
                linear-gradient(135deg,
                    #ff7200,
                    #ffad42);

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            box-shadow:
                0 10px 25px rgba(255, 114, 0, 0.3);

            transition:
                transform 0.2s,
                box-shadow 0.2s;

            animation: fadeUp 0.8s 0.6s both;
        }

        .login-button:hover {
            transform: translateY(-3px);

            box-shadow:
                0 15px 30px rgba(255, 114, 0, 0.4);
        }

        .login-button:active {
            transform: scale(0.97);
        }

        .footer {
            text-align: center;

            color: #999;

            font-size: 12px;

            margin-top: 25px;

            animation: fadeUp 0.8s 0.7s both;
        }

        /* =========================
           ANIMATIONS
        ========================== */

        @keyframes cardAppear {
            from {
                opacity: 0;
                transform:
                    translateY(70px) scale(0.85);
            }

            to {
                opacity: 1;
                transform:
                    translateY(0) scale(1);
            }
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes logoBounce {
            0% {
                transform: scale(0);
            }

            70% {
                transform: scale(1.15);
            }

            100% {
                transform: scale(1);
            }
        }

        @keyframes moneyFloat {

            0%,
            100% {
                transform:
                    translateY(0) rotate(-8deg);
            }

            50% {
                transform:
                    translateY(-25px) rotate(8deg);
            }
        }

        @keyframes coinSpin {
            0% {
                transform:
                    rotateY(0deg) translateY(0);
            }

            50% {
                transform:
                    rotateY(180deg) translateY(-20px);
            }

            100% {
                transform:
                    rotateY(360deg) translateY(0);
            }
        }

        @keyframes lightMove {

            0%,
            100% {
                transform: translate(0, 0);
            }

            50% {
                transform: translate(80px, 40px);
            }
        }

        @keyframes boardFloat {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-4px);
            }
        }

        @keyframes deskMove {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-5px);
            }
        }

        /* =========================
           RESPONSIVE HP
        ========================== */

        @media (max-width: 600px) {

            .login-card {
                padding: 32px 25px;
                border-radius: 23px;
            }

            .board {
                width: 55%;
                height: 20%;
                left: 5%;
            }

            .desk {
                transform: scale(0.65);
            }

            .money {
                font-size: 30px;
            }

            .coin {
                width: 38px;
                height: 38px;
                font-size: 15px;
            }

            h1 {
                font-size: 26px;
            }
        }
    </style>
</head>

<body>

    <!-- =========================
         BACKGROUND RUANG KELAS
    ========================== -->

    <div class="classroom"></div>

    <div class="light light1"></div>
    <div class="light light2"></div>

    <div class="board"></div>

    <div class="desk desk1"></div>
    <div class="desk desk2"></div>
    <div class="desk desk3"></div>


    <!-- UANG -->

    <div class="money money1">💵</div>
    <div class="money money2">💴</div>
    <div class="money money3">💶</div>
    <div class="money money4">💵</div>


    <!-- KOIN -->

    <div class="coin coin1">Rp</div>
    <div class="coin coin2">Rp</div>
    <div class="coin coin3">Rp</div>


    <!-- =========================
         LOGIN
    ========================== -->

    <div class="wrapper">

        <div class="login-card">

            <div class="logo">
                K
            </div>

            <h1>
                Selamat Datang 👋
            </h1>

            <p class="subtitle">
                Kelola kas kelas bersama KhasKU
            </p>


            <form action="/api/auth" method="POST">

                <!-- USERNAME -->

                <div class="input-group">

                    <label for="username">
                        Username
                    </label>

                    <div class="input-box">

                        <span class="icon">
                            👤
                        </span>

                        <input type="text" id="username" name="username" placeholder="Masukkan username" required>

                    </div>

                </div>


                <!-- PASSWORD -->

                <div class="input-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="input-box">

                        <span class="icon">
                            🔒
                        </span>

                        <input type="password" id="password" name="password" placeholder="Masukkan password" required>

                    </div>

                </div>


                <!-- LOGIN BUTTON -->

                <button type="submit" class="login-button">
                    Masuk
                </button>

            </form>


            <div class="footer">
                KhasKU • Sistem Kas Kelas
            </div>

        </div>

    </div>


    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script>

        const form = document.querySelector("form");
        const button = document.querySelector(".login-button");

        form.addEventListener("submit", function () {

            button.innerHTML = "Memproses...";

            button.style.opacity = "0.8";

            button.style.cursor = "wait";

        });

    </script>

</body>

</html>
