<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>KhasKU - Registrasi</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #f3eadc;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* =========================
           LATAR KELAS
        ========================== */

        .background {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .circle {
            position: absolute;
            border-radius: 50%;
            filter: blur(2px);
            opacity: 0.5;
            animation: moveCircle 8s ease-in-out infinite alternate;
        }

        .circle.one {
            width: 180px;
            height: 180px;
            background: #f6c76e;
            top: -50px;
            left: -40px;
        }

        .circle.two {
            width: 220px;
            height: 220px;
            background: #d8b892;
            right: -70px;
            bottom: -60px;
            animation-delay: 2s;
        }

        /* =========================
           UANG BERGERAK
        ========================== */

        .money {
            position: absolute;
            font-size: 30px;
            opacity: 0.35;
            animation: moneyFloat linear infinite;
        }

        .money.one {
            left: 10%;
            animation-duration: 8s;
        }

        .money.two {
            left: 25%;
            animation-duration: 11s;
            animation-delay: 2s;
        }

        .money.three {
            right: 20%;
            animation-duration: 9s;
            animation-delay: 1s;
        }

        .money.four {
            right: 8%;
            animation-duration: 12s;
            animation-delay: 3s;
        }

        @keyframes moneyFloat {

            0% {
                transform: translateY(110vh) rotate(0deg);
            }

            100% {
                transform: translateY(-120px) rotate(360deg);
            }

        }

        @keyframes moveCircle {

            from {
                transform: translate(0, 0);
            }

            to {
                transform: translate(40px, 30px);
            }

        }

        /* =========================
           CONTAINER
        ========================== */

        .container {
            width: 900px;
            max-width: 92%;
            min-height: 560px;
            background: #fffaf2;
            border-radius: 28px;
            box-shadow: 0 20px 50px rgba(80, 55, 30, 0.18);
            display: grid;
            grid-template-columns: 1fr 1.1fr;
            overflow: hidden;
            position: relative;
            z-index: 2;

            animation: containerAppear 0.8s ease;
        }

        @keyframes containerAppear {

            from {
                opacity: 0;
                transform: translateY(40px) scale(0.95);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }

        }

        /* =========================
           BAGIAN KIRI
        ========================== */

        .classroom {
            background: #345342;
            color: white;
            padding: 45px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .classroom::before {
            content: "";
            position: absolute;
            width: 180px;
            height: 180px;
            border: 2px solid rgba(255, 255, 255, 0.15);
            border-radius: 50%;
            top: -70px;
            right: -70px;
            animation: rotateCircle 12s linear infinite;
        }

        @keyframes rotateCircle {

            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }

        }

        .logo {
            width: 55px;
            height: 55px;
            background: #f59e0b;
            border-radius: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 25px;
            font-weight: bold;
            margin-bottom: 25px;

            animation: logoBounce 2s ease-in-out infinite;
        }

        @keyframes logoBounce {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-7px);
            }

        }

        .classroom h1 {
            font-size: 34px;
            margin-bottom: 15px;
        }

        .classroom p {
            line-height: 1.7;
            opacity: 0.85;
        }

        .school-board {
            margin-top: 35px;
            padding: 18px;
            border: 2px dashed rgba(255, 255, 255, 0.4);
            border-radius: 15px;
            animation: boardFade 1.5s ease;
        }

        @keyframes boardFade {

            from {
                opacity: 0;
                transform: translateX(-30px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }

        }

        .school-board p {
            margin: 5px 0;
        }

        /* =========================
           FORM REGISTRASI
        ========================== */

        .register-area {
            padding: 45px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .register-area h2 {
            font-size: 30px;
            color: #3f3328;
            margin-bottom: 8px;

            animation: titleAppear 0.8s ease;
        }

        .subtitle {
            color: #777;
            margin-bottom: 28px;

            animation: titleAppear 1s ease;
        }

        @keyframes titleAppear {

            from {
                opacity: 0;
                transform: translateY(-15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }

        /* =========================
           INPUT
        ========================== */

        .input-group {
            margin-bottom: 18px;
            animation: inputAppear 0.7s ease backwards;
        }

        .input-group:nth-child(2) {
            animation-delay: 0.15s;
        }

        .input-group:nth-child(3) {
            animation-delay: 0.3s;
        }

        .input-group:nth-child(4) {
            animation-delay: 0.45s;
        }

        @keyframes inputAppear {

            from {
                opacity: 0;
                transform: translateX(25px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }

        }

        .input-group label {
            display: block;
            font-size: 14px;
            font-weight: bold;
            color: #555;
            margin-bottom: 8px;
        }

        .input-box {
            position: relative;
        }

        .input-box span {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 19px;
        }

        .input-box input {
            width: 100%;
            padding: 14px 15px 14px 48px;
            border: 2px solid #eadfce;
            border-radius: 13px;
            outline: none;
            background: #fffdf9;
            transition: 0.3s;
            font-size: 14px;
        }

        .input-box input:focus {
            border-color: #f59e0b;
            box-shadow: 0 0 0 4px rgba(245, 158, 11, 0.12);
            transform: translateY(-2px);
        }

        /* =========================
           BUTTON
        ========================== */

        button {
            width: 100%;
            border: none;
            padding: 15px;
            border-radius: 13px;
            background: #f59e0b;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;

            animation: buttonAppear 1s ease;
            transition: 0.3s;
        }

        button:hover {
            background: #d97706;
            transform: translateY(-3px);
            box-shadow: 0 8px 18px rgba(245, 158, 11, 0.25);
        }

        button:active {
            transform: scale(0.97);
        }

        @keyframes buttonAppear {

            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }

        /* =========================
           LOGIN LINK
        ========================== */

        .login-link {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #777;
        }

        .login-link a {
            color: #d97706;
            font-weight: bold;
            text-decoration: none;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        /* =========================
           RESPONSIVE
        ========================== */

        @media (max-width: 750px) {

            body {
                overflow-y: auto;
                padding: 25px 0;
            }

            .container {
                grid-template-columns: 1fr;
                max-width: 430px;
            }

            .classroom {
                padding: 30px;
                min-height: 250px;
            }

            .classroom h1 {
                font-size: 28px;
            }

            .school-board {
                margin-top: 20px;
            }

            .register-area {
                padding: 30px;
            }

        }
    </style>
</head>

<body>

    <!-- LATAR ANIMASI -->
    <div class="background">

        <div class="circle one"></div>
        <div class="circle two"></div>

        <div class="money one">💵</div>
        <div class="money two">🪙</div>
        <div class="money three">💰</div>
        <div class="money four">💵</div>

    </div>


    <!-- CONTAINER UTAMA -->
    <div class="container">

        <!-- BAGIAN KELAS -->
        <div class="classroom">

            <div class="logo">
                K
            </div>

            <h1>
                Gabung di KhasKU
            </h1>

            <p>
                Buat akun untuk mulai mengelola
                kas kelas dengan lebih mudah,
                rapi, dan transparan.
            </p>

            <div class="school-board">

                <p>🏫 Kelas Digital</p>
                <p>💰 Kelola Kas</p>
                <p>📊 Pantau Keuangan</p>

            </div>

        </div>


        <!-- FORM -->
        <div class="register-area">

            <h2>
                Buat Akun
            </h2>

            <p class="subtitle">
                Daftarkan akun baru untuk KhasKU
            </p>


            <form action="/api/auth/register" method="POST">

                <!-- USERNAME -->
                <div class="input-group">

                    <label for="username">
                        Username
                    </label>

                    <div class="input-box">

                        <span>👤</span>

                        <input type="text" id="username" name="username" placeholder="Masukkan username" required>

                    </div>

                </div>


                <!-- PASSWORD -->
                <div class="input-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="input-box">

                        <span>🔐</span>

                        <input type="password" id="password" name="password" placeholder="Masukkan password" required>

                    </div>

                </div>


                <!-- KONFIRMASI PASSWORD -->
                <div class="input-group">

                    <label for="confirmPassword">
                        Konfirmasi Password
                    </label>

                    <div class="input-box">

                        <span>🔑</span>

                        <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Ulangi password"
                            required>

                    </div>

                </div>


                <button type="submit">
                    ✨ Buat Akun
                </button>

            </form>


            <div class="login-link">

                Sudah punya akun?

                <a href="/">
                    Login di sini
                </a>

            </div>

        </div>

    </div>

</body>

</html>
